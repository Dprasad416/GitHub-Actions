name: build-deploy
on: 
  push: 
   branches: 
    - main
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name=='pull_request' && github.event_name.pull_request.base_ref=='main'
    steps:
      - name: build step
        run: echo "building the application"
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name=='push' && github.ref_name=='main'
    steps:
      - name: deploy step
        run: echo "deploying the application"
