name:
on: 
    push: 
        branches:
            - main
            - dev
            - feature
jobs: 
    sonar:
        runs-on: ubuntu-latest
        if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
        steps: 
            - name: Quality check
              run: echo "Checking the code quality"
    deploy-dev:
        runs-on: ubuntu-latest
        if: github.ref_name == 'dev' && github.event_name == 'push'
        steps: 
            - name: Deploy to dev
              run: echo "Deploying to dev environment"
    deploy-main:
        runs-on: ubuntu-latest
        if: github.ref_name == 'main' && github.event_name == 'push'
        steps: 
            - name: Deploy to main
              run: echo "Deploying to main environment"
    success-notification:
        needs: [sonar, deploy-dev, deploy-main]
        runs-on: ubuntu-latest
        if: always() && !failure()
        steps: 
            - name: Notify success
              run: echo "All jobs completed successfully"
    failure-notification:
        needs: [sonar, deploy-dev, deploy-main]
        runs-on: ubuntu-latest
        if: failure()
        steps: 
            - name: Notify failure
              run: echo "One or more jobs failed"