name: push
on: 
  push:
    branches:
      - main
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: echo "git checkout...."
  build:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: build
        run: echo "packaging the code....."
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: testing
        run: echo "running test cases..."
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: deploying
        run: echo "deploying application"
